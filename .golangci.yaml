---
version: "2"

linters:
  settings:
    misspell:
      locale: US
    errorlint:
      # Report non-wrapping error creation using fmt.Errorf
      errorf: false
    gosec:
      # Disable G104: Errors unhandled (similar to errcheck which is disabled)
      excludes:
        - G104
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^time\.Unix(Milli|Micro)?$'
          msg: wall clock; the Limiter measures time on the monotonic clock
        - pattern: '^time\.Time\.Unix(Nano|Milli|Micro)?$'
          msg: wall clock; the Limiter measures time on the monotonic clock
  enable:
    - dupl
    - forbidigo
    - intrange
    - testifylint
    - unparam
    - errorlint
    - goconst
    - gosec
    - misspell
    - unconvert
    - prealloc
  disable:
    - errcheck
    - ineffassign
    # Disable default-enabled linters
    - govet
    - staticcheck
    - unused
  exclusions:
    rules:
      # Test files often repeat literals for readability.
      - path: _test\.go
        linters:
          - goconst
      # Tests build fixed instants for arithmetic; they read no clock.
      - path: _test\.go
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
